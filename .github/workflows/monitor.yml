name: Monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production checks
        id: checks
        run: node tests/monitoring/uptime-checks.ts
        continue-on-error: true
      - name: Open alert issue on failure
        if: steps.checks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "uptime-incident";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (existing.length > 0) {
              console.log(`Incident already open: #${existing[0].number}`);
              return;
            }
            const date = new Date().toISOString();
            const body = [
              "## Uptime incident",
              "",
              `One or more production checks failed at **${date}** (workflow run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})).`,
              "",
              "Run `node tests/monitoring/uptime-checks.ts` locally to reproduce and see which monitor failed.",
              "",
              "- [ ] Investigate failed check(s)",
              "- [ ] Fix root cause",
              "- [ ] Verify monitors pass on the next scheduled run",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Uptime check failed — ${date}`,
              body,
              labels: [label],
            });
      - name: Close alert issue on recovery
        if: steps.checks.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "uptime-incident";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            for (const issue of existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`Closed incident #${issue.number}`);
            }
