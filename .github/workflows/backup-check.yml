name: Backup Check
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

env:
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  verify-backups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check PITR status
        run: supabase backups list --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - name: Create backup dump
        run: |
          supabase db dump --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --file "backup-$(date +%Y-%m-%d).sql"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 30
